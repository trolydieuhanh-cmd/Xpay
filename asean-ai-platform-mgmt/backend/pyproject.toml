[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line-too-long (đã có line-length ở trên, để tự do trong string)
    "B008",  # function call in default arg (FastAPI Depends)
    "UP007", # X | Y syntax — OK, chúng ta dùng Python 3.11+
]

[tool.ruff.lint.per-file-ignores]
"app/__init__.py" = ["F401"]
"app/**/__init__.py" = ["F401"]
