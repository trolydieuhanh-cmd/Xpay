plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def releaseStoreFile = System.getenv("XPAYCHAT_UPLOAD_STORE_FILE")
def releaseStorePassword = System.getenv("XPAYCHAT_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("XPAYCHAT_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = System.getenv("XPAYCHAT_UPLOAD_KEY_PASSWORD")
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.gatewayxpay.chatnative'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gatewayxpay.chatnative'
        minSdk 23
        targetSdk 35
        versionCode 100
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation "com.google.firebase:firebase-messaging:24.1.0"
    implementation "com.google.zxing:core:3.5.3"
    implementation "io.github.webrtc-sdk:android:144.7559.05"
}
