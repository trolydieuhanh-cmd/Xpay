server {
    listen 80;
    listen [::]:80;
    server_name gatewayxpay.com www.gatewayxpay.com;

    root /docker/xpaychat-prod;
    index index.html;

    client_max_body_size 50m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    access_log /var/log/nginx/gatewayxpay.com.access.log;
    error_log /var/log/nginx/gatewayxpay.com.error.log;

    location ~* ^/(?:data|backups|deploy|scripts|load-tests|\.git|node_modules)(?:/|$) {
        return 404;
    }

    location ~ (^|/)\.(?!well-known/) {
        return 404;
    }

    location ~* ^/(?:server\.js|package(?:-lock)?\.json|xpaychat-deploy\.tar\.gz|.*\.(?:service|env|log|bak|sql|sqlite|db|gz|zip|tar|apk|aab))$ {
        return 404;
    }

    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4182;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|mp4|webm|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
